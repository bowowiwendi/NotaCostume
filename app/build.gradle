plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing release: baca keystore.properties (lokal, tidak di-commit) atau env CI.
// Jika tidak tersedia, build release memakai debug signing agar tetap bisa dibuild.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasKeystore = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    hasKeystore = keystoreProps["keystoreFile"] != null
} else if (System.getenv("KEYSTORE_B64") != null) {
    hasKeystore = true
}

android {
    namespace 'com.notacostume.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.notacostume.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps["keystoreFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            } else {
                // Dari env CI (KEYSTORE_B64 = base64 keystore)
                def keystoreB64 = System.getenv("KEYSTORE_B64")
                if (keystoreB64 != null) {
                    def tmp = new File(buildDir, "release.keystore")
                    tmp.parentFile.mkdirs()
                    tmp.bytes = keystoreB64.decodeBase64()
                    storeFile tmp
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Pakai signing rilis jika keystore ada, kalau tidak pakai debug signing
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Barcode scanning (ML Kit)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // CameraX for barcode scanner preview
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
